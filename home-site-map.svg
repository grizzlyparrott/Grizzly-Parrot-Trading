<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Grizzly Parrot Trading site map</title>
  <desc id="desc">A central searchable library connects to futures education, product research, platform and risk tools, prop-account mechanics, books, and editorial information.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.56" stop-color="#0a1728"/>
      <stop offset="1" stop-color="#071421"/>
    </linearGradient>
    <linearGradient id="center" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102b28"/>
      <stop offset="1" stop-color="#0d1c2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4fe18f" stop-opacity=".22"/>
      <stop offset="1" stop-color="#4fe18f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#9bc1df" stroke-opacity=".045"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5 0 10Z" fill="#51e391"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5 0 10Z" fill="#86b9ff"/>
    </marker>
    <style>
      .eyebrow{font:800 15px Inter,Segoe UI,sans-serif;letter-spacing:3px}
      .heading{font:900 35px Inter,Segoe UI,sans-serif;letter-spacing:-1px}
      .card-label{font:900 14px Inter,Segoe UI,sans-serif;letter-spacing:2px}
      .card-title{font:800 24px Inter,Segoe UI,sans-serif}
      .card-copy{font:500 16px Inter,Segoe UI,sans-serif}
      .center-title{font:900 30px Inter,Segoe UI,sans-serif;letter-spacing:-.5px}
      .center-copy{font:600 18px Inter,Segoe UI,sans-serif}
      .footer-title{font:800 18px Inter,Segoe UI,sans-serif}
      .footer-copy{font:500 15px Inter,Segoe UI,sans-serif}
    </style>
  </defs>

  <rect width="1200" height="800" rx="28" fill="url(#background)"/>
  <rect width="1200" height="800" rx="28" fill="url(#grid)"/>
  <circle cx="600" cy="400" r="330" fill="url(#glow)"/>
  <rect x="30" y="30" width="1140" height="740" rx="22" fill="none" stroke="#274158" stroke-width="2"/>

  <text x="64" y="80" class="eyebrow" fill="#51e391">SITE MAP</text>
  <text x="64" y="121" class="heading" fill="#f8fafc">ONE LIBRARY. MULTIPLE WAYS IN.</text>
  <path d="M60 136H1140" stroke="#2c4358"/>

  <path d="M430 250C500 265 520 286 550 316" fill="none" stroke="#51e391" stroke-width="3" stroke-opacity=".68" marker-end="url(#arrow-green)"/>
  <path d="M770 250C700 265 680 286 650 316" fill="none" stroke="#86b9ff" stroke-width="3" stroke-opacity=".68" marker-end="url(#arrow-blue)"/>
  <path d="M430 595C500 575 520 545 550 500" fill="none" stroke="#f4c55e" stroke-width="3" stroke-opacity=".72" marker-end="url(#arrow-green)"/>
  <path d="M770 595C700 575 680 545 650 500" fill="none" stroke="#a78bfa" stroke-width="3" stroke-opacity=".72" marker-end="url(#arrow-blue)"/>

  <g filter="url(#shadow)">
    <rect x="60" y="165" width="370" height="120" rx="18" fill="#0e1f33" stroke="#284158" stroke-width="2"/>
    <rect x="60" y="165" width="7" height="120" rx="3.5" fill="#51e391"/>
    <text x="90" y="198" class="card-label" fill="#51e391">LEARN THE MECHANICS</text>
    <text x="90" y="232" class="card-title" fill="#fff">Futures + Market Basics</text>
    <text x="90" y="260" class="card-copy" fill="#95a8bc">Contracts · risk · orders · execution</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="770" y="165" width="370" height="120" rx="18" fill="#0e1f33" stroke="#284158" stroke-width="2"/>
    <rect x="1133" y="165" width="7" height="120" rx="3.5" fill="#86b9ff"/>
    <text x="800" y="198" class="card-label" fill="#86b9ff">STUDY A MARKET</text>
    <text x="800" y="232" class="card-title" fill="#fff">Metals · Currencies · Energies</text>
    <text x="800" y="260" class="card-copy" fill="#95a8bc">Products · drivers · structure · behavior</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="60" y="535" width="370" height="120" rx="18" fill="#0e1f33" stroke="#284158" stroke-width="2"/>
    <rect x="60" y="535" width="7" height="120" rx="3.5" fill="#f4c55e"/>
    <text x="90" y="568" class="card-label" fill="#f4c55e">WORK THE PROCESS</text>
    <text x="90" y="602" class="card-title" fill="#fff">Platforms + Trading Tools</text>
    <text x="90" y="630" class="card-copy" fill="#95a8bc">Setup · workflow · sizing · scenarios</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="770" y="535" width="370" height="120" rx="18" fill="#0e1f33" stroke="#284158" stroke-width="2"/>
    <rect x="1133" y="535" width="7" height="120" rx="3.5" fill="#a78bfa"/>
    <text x="800" y="568" class="card-label" fill="#c4b5fd">UNDERSTAND ACCOUNT RULES</text>
    <text x="800" y="602" class="card-title" fill="#fff">Prop Firm Trading</text>
    <text x="800" y="630" class="card-copy" fill="#95a8bc">Evaluations · drawdown · usable room</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="330" y="300" width="540" height="205" rx="26" fill="url(#center)" stroke="#4edb8c" stroke-width="2"/>
    <circle cx="410" cy="402" r="46" fill="#14392d" stroke="#51e391" stroke-width="2"/>
    <text x="410" y="413" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="28" font-weight="900" fill="#66efa4">GP</text>
    <text x="480" y="365" class="card-label" fill="#51e391">GRIZZLY PARROT TRADING</text>
    <text x="480" y="410" class="center-title" fill="#fff">Search one question</text>
    <text x="480" y="443" class="center-title" fill="#fff">or choose a section.</text>
    <text x="480" y="476" class="center-copy" fill="#a8b8ca">Guides · research · tools · books</text>
  </g>

  <g>
    <rect x="60" y="698" width="1080" height="48" rx="13" fill="#0d1b2d" stroke="#294056"/>
    <circle cx="88" cy="722" r="6" fill="#f4c55e"/>
    <text x="108" y="728" class="footer-title" fill="#fff">Books connect the full framework</text>
    <path d="M425 709V735" stroke="#334c62"/>
    <circle cx="458" cy="722" r="6" fill="#51e391"/>
    <text x="478" y="728" class="footer-title" fill="#fff">About explains the editorial scope</text>
    <text x="1099" y="727" text-anchor="end" class="footer-copy" fill="#8fa2b6">Search · browse · learn</text>
  </g>
</svg>
