name: IndexNow submissions

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/indexnow.yml
      - build_sitemap.py
      - scripts/submit_indexnow.py
      - tests/test_build_sitemap.py
      - tests/test_submit_indexnow.py
      - 88679a166d56460fbce57ed37803582a.txt
      - sitemap.xml
  pull_request:
    paths:
      - .github/workflows/indexnow.yml
      - build_sitemap.py
      - scripts/submit_indexnow.py
      - tests/test_build_sitemap.py
      - tests/test_submit_indexnow.py
      - 88679a166d56460fbce57ed37803582a.txt
      - sitemap.xml
  workflow_run:
    workflows:
      - pages-build-deployment
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      scope:
        description: Submit all sitemap URLs or only URLs changed since the preceding successful Pages deployment.
        required: true
        default: all
        type: choice
        options:
          - all
          - changed

permissions:
  actions: read
  contents: read

jobs:
  validate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run unit and repository dry-run checks
        run: |
          python -m unittest discover -s tests -v
          python scripts/submit_indexnow.py --all --dry-run --skip-live-check

  submit:
    needs: validate
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: indexnow-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - name: Check out the deployed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve submission scope
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          REQUESTED_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'changed' }}
        run: |
          set -euo pipefail

          if [[ "$REQUESTED_SCOPE" == "all" ]]; then
            echo "scope=all" >> "$GITHUB_OUTPUT"
            echo "IndexNow scope: all sitemap URLs" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          previous_sha="$({
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&status=success&per_page=100" \
              --jq ".workflow_runs[] | select(.name == \"pages-build-deployment\" and .conclusion == \"success\" and .head_sha != \"${CURRENT_SHA}\") | .head_sha"
          } | sed -n '1p')"

          if [[ -z "$previous_sha" ]] || ! git cat-file -e "${previous_sha}^{commit}"; then
            echo "scope=all" >> "$GITHUB_OUTPUT"
            echo "IndexNow scope: all URLs (no usable prior deployment was found)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! git merge-base --is-ancestor "$previous_sha" "$CURRENT_SHA"; then
            echo "scope=all" >> "$GITHUB_OUTPUT"
            echo "IndexNow scope: all URLs (deployment history is not linear)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "scope=changed" >> "$GITHUB_OUTPUT"
          echo "base_sha=$previous_sha" >> "$GITHUB_OUTPUT"
          echo "IndexNow scope: changed URLs" >> "$GITHUB_STEP_SUMMARY"
          echo "Previous Pages revision: \`$previous_sha\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Current Pages revision: \`$CURRENT_SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate deployment and notify IndexNow
        shell: bash
        env:
          CURRENT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          REPORT_PATH: ${{ runner.temp }}/indexnow-report.json
          SCOPE: ${{ steps.scope.outputs.scope }}
          BASE_SHA: ${{ steps.scope.outputs.base_sha }}
        run: |
          set -euo pipefail
          mode=(--all)
          if [[ "$SCOPE" == "changed" ]]; then
            mode=(--changed-since "$BASE_SHA" --head "$CURRENT_SHA")
          fi

          python scripts/submit_indexnow.py \
            "${mode[@]}" \
            --repo-root . \
            --live-check-timeout 300 \
            --live-check-interval 10 \
            --report "$REPORT_PATH"

          python - "$REPORT_PATH" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          with Path(sys.argv[2]).open("a", encoding="utf-8") as summary:
              summary.write(f"\nSubmission state: **{report['status']}**\n\n")
              summary.write(f"URLs selected: **{report.get('url_count', 0)}**\n")
          PY

      - name: Preserve IndexNow report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: indexnow-report-${{ github.run_id }}
          path: ${{ runner.temp }}/indexnow-report.json
          if-no-files-found: warn
          retention-days: 30
