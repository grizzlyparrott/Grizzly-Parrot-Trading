<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Volatility clustering regime map</title><desc id="desc">A stylized return series moves through quiet, elevated, and quieter conditions. It shows return magnitude, not direction prediction.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#0b2740"/></linearGradient><linearGradient id="quiet" x2="1"><stop stop-color="#50d8ff" stop-opacity=".08"/><stop offset="1" stop-color="#50d8ff" stop-opacity=".18"/></linearGradient><linearGradient id="active" x2="1"><stop stop-color="#f6c75a" stop-opacity=".12"/><stop offset="1" stop-color="#fb7185" stop-opacity=".2"/></linearGradient></defs><rect width="1200" height="720" rx="34" fill="url(#bg)"/><g stroke="#9db2c6" stroke-opacity=".18"><path d="M80 170H1120M80 290H1120M80 410H1120M80 530H1120"/><path d="M80 110V590M260 110V590M440 110V590M620 110V590M800 110V590M980 110V590M1120 110V590"/></g><text x="80" y="74" fill="#f4f8fb" font-family="Arial, sans-serif" font-size="30" font-weight="700">Return magnitude can persist in regimes</text><text x="80" y="102" fill="#aabfd1" font-family="Arial, sans-serif" font-size="18">Illustration only — the signs of the moves do not supply a directional forecast.</text><path d="M80 165H405V535H80Z" fill="url(#quiet)"/><path d="M405 165H825V535H405Z" fill="url(#active)"/><path d="M825 165H1120V535H825Z" fill="url(#quiet)"/><g font-family="Arial, sans-serif"><text x="112" y="145" fill="#50d8ff" font-size="18" font-weight="700">QUIET SAMPLE</text><text x="510" y="145" fill="#f6c75a" font-size="18" font-weight="700">ELEVATED SAMPLE</text><text x="900" y="145" fill="#50d8ff" font-size="18" font-weight="700">QUIET SAMPLE</text></g><path d="M80 350 L120 322 160 376 200 340 240 360 280 328 320 374 360 344 400 362 440 264 480 430 520 206 560 470 600 280 640 450 680 182 720 480 760 238 800 414 840 356 880 328 920 372 960 344 1000 362 1040 332 1080 370 1120 346" fill="none" stroke="#f4f8fb" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><g fill="#f4f8fb"><circle cx="440" cy="264" r="7"/><circle cx="520" cy="206" r="7"/><circle cx="560" cy="470" r="7"/><circle cx="680" cy="182" r="7"/><circle cx="720" cy="480" r="7"/></g><g font-family="Arial, sans-serif"><rect x="84" y="620" width="310" height="48" rx="24" fill="#12334a"/><text x="108" y="650" fill="#dceaf4" font-size="17">Measure magnitude with a declared method</text><path d="M425 644H770" stroke="#62e6a0" stroke-width="3" stroke-dasharray="8 8"/><text x="470" y="650" fill="#62e6a0" font-size="18" font-weight="700">Recalculate size and execution assumptions</text><rect x="818" y="620" width="300" height="48" rx="24" fill="#12334a"/><text x="845" y="650" fill="#dceaf4" font-size="17">Do not infer the next direction</text></g></svg>
