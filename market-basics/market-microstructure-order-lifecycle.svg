<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Market microstructure order lifecycle</title><desc id="desc">A diagram separates resting quotes, marketable orders, matching and completed trades, and states that neither a quote nor a trade proves participant intent.</desc><rect width="1200" height="720" rx="34" fill="#071827"/><g font-family="Arial, sans-serif"><text x="70" y="78" fill="#f4f8fb" font-size="31" font-weight="700">A quote, an order, and a trade are different observations</text><text x="70" y="108" fill="#aabfd1" font-size="18">Keep the order book separate from executed transactions before adding an interpretation.</text><g fill="#102e44" stroke="#50d8ff" stroke-opacity=".65"><rect x="70" y="210" width="250" height="150" rx="20"/><rect x="470" y="210" width="250" height="150" rx="20"/><rect x="870" y="210" width="250" height="150" rx="20"/></g><text x="106" y="258" fill="#50d8ff" font-size="18" font-weight="700">RESTING QUOTE</text><text x="106" y="300" fill="#edf5fa" font-size="22">Displayed bid or offer</text><text x="106" y="330" fill="#afc0d0" font-size="16">may change or cancel</text><text x="505" y="258" fill="#f6c75a" font-size="18" font-weight="700">MARKETABLE ORDER</text><text x="505" y="300" fill="#edf5fa" font-size="22">Reaches available price</text><text x="505" y="330" fill="#afc0d0" font-size="16">can sweep more than one level</text><text x="910" y="258" fill="#62e6a0" font-size="18" font-weight="700">COMPLETED TRADE</text><text x="910" y="300" fill="#edf5fa" font-size="22">Execution is recorded</text><text x="910" y="330" fill="#afc0d0" font-size="16">does not reveal motive</text><path d="M320 285H450M720 285H850" stroke="#50d8ff" stroke-width="6"/><path d="M440 274l17 11-17 11M840 274l17 11-17 11" fill="none" stroke="#50d8ff" stroke-width="5"/><rect x="160" y="470" width="880" height="104" rx="22" fill="#0c2234" stroke="#fb7185" stroke-opacity=".55"/><text x="205" y="515" fill="#fb7185" font-size="19" font-weight="700">OBSERVABLE DATA ≠ PARTICIPANT IDENTITY OR INTENT</text><text x="205" y="550" fill="#d2dfe9" font-size="18">Use venue rules, timestamp, depth, trade data, aggregation and latency limits before making a narrower claim.</text><text x="70" y="650" fill="#9db4c8" font-size="17">Matching priority and order handling vary by venue and instrument; verify the current rulebook for the exact market.</text></g></svg>
