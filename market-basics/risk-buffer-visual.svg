<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-labelledby="title desc">
  <title id="title">Real drawdown buffer diagram</title>
  <desc id="desc">An illustrative current balance of 51,350 dollars sits above a breach floor of 50,500 dollars. The 850-dollar raw buffer is split into a 500-dollar usable buffer and a protected 350-dollar safety reserve.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10233a"/>
      <stop offset="1" stop-color="#060d18"/>
    </linearGradient>
    <linearGradient id="usable" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4bea87"/>
      <stop offset="1" stop-color="#1fb563"/>
    </linearGradient>
    <linearGradient id="reserve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd86b"/>
      <stop offset="1" stop-color="#d99a22"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".32"/>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#8fa5c1" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="960" height="680" rx="32" fill="url(#background)"/>
  <rect width="960" height="680" rx="32" fill="url(#grid)"/>
  <circle cx="94" cy="56" r="210" fill="#2adc78" opacity=".08"/>
  <circle cx="900" cy="650" r="250" fill="#4da8ff" opacity=".06"/>

  <text x="62" y="76" fill="#72ed9c" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="2.3">REAL DRAWDOWN BUFFER</text>
  <text x="62" y="114" fill="#f3f7fb" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="760">What can actually be lost?</text>
  <text x="62" y="145" fill="#9eb0c5" font-family="Inter, Arial, sans-serif" font-size="16">Illustrative values &#183; not a prop-firm rule</text>

  <g filter="url(#shadow)">
    <rect x="52" y="184" width="856" height="432" rx="24" fill="#081321" stroke="#2c425e" stroke-width="2"/>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <text x="92" y="235" fill="#93a7be" font-size="14" font-weight="700" letter-spacing="1.6">CURRENT BALANCE</text>
    <text x="92" y="276" fill="#f8fafc" font-size="34" font-weight="800">$51,350</text>
    <line x1="92" y1="298" x2="448" y2="298" stroke="#263b54"/>

    <text x="92" y="348" fill="#93a7be" font-size="14" font-weight="700" letter-spacing="1.6">RAW BUFFER</text>
    <text x="92" y="385" fill="#dce6f1" font-size="28" font-weight="760">$850</text>
    <text x="92" y="415" fill="#8fa3ba" font-size="15">$51,350 &#8722; $50,500</text>

    <rect x="92" y="459" width="356" height="103" rx="16" fill="#0e2034" stroke="#29425e"/>
    <text x="116" y="491" fill="#8ea2b8" font-size="13" font-weight="700" letter-spacing="1.3">RULE</text>
    <text x="116" y="522" fill="#eef5fb" font-size="19" font-weight="720">Reserve first. Size second.</text>
    <text x="116" y="547" fill="#9db0c5" font-size="14">The floor is never the planned exit.</text>
  </g>

  <g transform="translate(544 224)" font-family="Inter, Arial, sans-serif">
    <rect x="0" y="0" width="288" height="338" rx="20" fill="#060d17" stroke="#314861" stroke-width="2"/>

    <rect x="34" y="44" width="118" height="160" rx="12" fill="url(#usable)"/>
    <rect x="34" y="204" width="118" height="90" rx="0" fill="url(#reserve)"/>
    <path d="M34 216V56q0-12 12-12h94q12 0 12 12v238H34z" fill="none" stroke="#e9fdf0" stroke-opacity=".34"/>

    <line x1="20" y1="44" x2="260" y2="44" stroke="#7ff1a7" stroke-width="2"/>
    <circle cx="20" cy="44" r="5" fill="#7ff1a7"/>
    <text x="170" y="39" fill="#91a4ba" font-size="12" font-weight="700" letter-spacing="1.1">BALANCE</text>
    <text x="170" y="59" fill="#ecf8f0" font-size="16" font-weight="800">$51,350</text>

    <text x="55" y="115" fill="#052313" font-size="12" font-weight="850" letter-spacing="1.2">USABLE</text>
    <text x="55" y="145" fill="#032313" font-size="24" font-weight="850">$500</text>
    <text x="55" y="168" fill="#08341d" font-size="12" font-weight="700">SIZE FROM HERE</text>

    <text x="49" y="238" fill="#432b03" font-size="11" font-weight="850" letter-spacing=".8">SAFETY RESERVE</text>
    <text x="55" y="269" fill="#3a2606" font-size="22" font-weight="850">$350</text>

    <line x1="20" y1="294" x2="260" y2="294" stroke="#fb7185" stroke-width="3"/>
    <circle cx="20" cy="294" r="5" fill="#fb7185"/>
    <text x="170" y="287" fill="#fecdd3" font-size="12" font-weight="700" letter-spacing=".9">BREACH FLOOR</text>
    <text x="170" y="311" fill="#fff1f2" font-size="16" font-weight="800">$50,500</text>
  </g>
</svg>
