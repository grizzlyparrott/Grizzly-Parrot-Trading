<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-labelledby="title desc">
  <title id="title">False breakout versus accepted breakout</title>
  <desc id="desc">Two conceptual futures charts compare a breakout that sweeps a prior high and rejects back inside the range with a breakout that closes outside, retests the boundary, and continues.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12172a"/>
      <stop offset="1" stop-color="#05101f"/>
    </linearGradient>
    <linearGradient id="rangeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#54d3ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#54d3ff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000814" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity="0.07"/>
    </pattern>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#fb7185"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#4ade80"/>
    </marker>
  </defs>

  <rect width="960" height="680" rx="28" fill="url(#bg)"/>
  <rect width="960" height="680" rx="28" fill="url(#grid)"/>
  <circle cx="90" cy="95" r="170" fill="#f6c75a" opacity="0.05"/>
  <circle cx="900" cy="600" r="220" fill="#54d3ff" opacity="0.05"/>

  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="58" y="64" fill="#f6c75a" font-size="16" font-weight="800" letter-spacing="2">THE FIRST BREAK CANNOT TELL YOU THE OUTCOME</text>
    <text x="58" y="101" fill="#f8fafc" font-size="30" font-weight="800">Wait for the auction to reveal acceptance or rejection</text>
    <text x="58" y="130" fill="#9aa8bc" font-size="15">Same boundary. Similar first move. Different evidence afterward.</text>

    <g transform="translate(58 170)" filter="url(#shadow)">
      <rect width="400" height="372" rx="20" fill="#081628" stroke="#fb7185" stroke-opacity="0.3"/>
      <text x="24" y="34" fill="#fda4af" font-size="12" font-weight="800" letter-spacing="1.5">REJECTION PATH</text>
      <text x="24" y="62" fill="#f8fafc" font-size="22" font-weight="800">Sweep, return, failed reclaim</text>

      <rect x="24" y="146" width="352" height="150" rx="10" fill="url(#rangeFill)" stroke="#54d3ff" stroke-opacity="0.12"/>
      <text x="36" y="282" fill="#6d829c" font-size="11" font-weight="700">PRIOR RANGE</text>
      <line x1="24" y1="146" x2="376" y2="146" stroke="#f6c75a" stroke-width="2" stroke-dasharray="8 6"/>
      <text x="26" y="135" fill="#f6c75a" font-size="11" font-weight="800">PRIOR HIGH / BREAKOUT LEVEL</text>

      <path d="M34 258C73 248 77 219 111 225s40 30 72 12 31-61 66-75 48-39 67-16 0 55-24 69-25-11-46 0-20 46-61 55-69 0-105 19" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="316" cy="146" r="6" fill="#fb7185" filter="url(#glow)"/>
      <path d="M324 108c29 20 37 51 18 83" fill="none" stroke="#fb7185" stroke-width="2" marker-end="url(#arrowRed)"/>
      <text x="298" y="96" fill="#fda4af" font-size="11" font-weight="800">SWEEP</text>

      <g transform="translate(24 315)">
        <rect width="352" height="38" rx="10" fill="#241525" stroke="#fb7185" stroke-opacity="0.25"/>
        <circle cx="20" cy="19" r="7" fill="#fb7185"/>
        <path d="M16 15l8 8m0-8l-8 8" fill="none" stroke="#300711" stroke-width="2" stroke-linecap="round"/>
        <text x="37" y="23" fill="#f8fafc" font-size="12" font-weight="750">Excursion fails to earn acceptance</text>
      </g>
    </g>

    <g transform="translate(502 170)" filter="url(#shadow)">
      <rect width="400" height="372" rx="20" fill="#081628" stroke="#4ade80" stroke-opacity="0.3"/>
      <text x="24" y="34" fill="#65e897" font-size="12" font-weight="800" letter-spacing="1.5">ACCEPTANCE PATH</text>
      <text x="24" y="62" fill="#f8fafc" font-size="22" font-weight="800">Close, retest, continued progress</text>

      <rect x="24" y="146" width="352" height="150" rx="10" fill="url(#rangeFill)" stroke="#54d3ff" stroke-opacity="0.12"/>
      <text x="36" y="282" fill="#6d829c" font-size="11" font-weight="700">PRIOR RANGE</text>
      <line x1="24" y1="146" x2="376" y2="146" stroke="#f6c75a" stroke-width="2" stroke-dasharray="8 6"/>
      <text x="26" y="135" fill="#f6c75a" font-size="11" font-weight="800">PRIOR HIGH / BREAKOUT LEVEL</text>

      <path d="M34 261C72 250 82 221 111 228s35 28 65 9 35-66 72-78 41-29 62-7-4 39-26 43-21-31-2-42 38 2 57-22 25-52 38-71" fill="none" stroke="#4ade80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="284" cy="146" r="6" fill="#4ade80" filter="url(#glow)"/>
      <path d="M304 179c-23 10-31 0-22-24" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowGreen)"/>
      <text x="297" y="197" fill="#65e897" font-size="11" font-weight="800">RETEST HOLDS</text>

      <g transform="translate(24 315)">
        <rect width="352" height="38" rx="10" fill="#102a25" stroke="#4ade80" stroke-opacity="0.25"/>
        <circle cx="20" cy="19" r="7" fill="#4ade80"/>
        <path d="M16 19l3 3 6-8" fill="none" stroke="#04140b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="37" y="23" fill="#f8fafc" font-size="12" font-weight="750">Auction sustains trade outside the range</text>
      </g>
    </g>

    <g transform="translate(58 566)">
      <rect width="844" height="64" rx="16" fill="#0a1a2d" stroke="#5f7797" stroke-opacity="0.3"/>
      <g transform="translate(22 16)">
        <circle cx="16" cy="16" r="16" fill="#f6c75a" fill-opacity="0.16" stroke="#f6c75a" stroke-opacity="0.5"/>
        <text x="16" y="21" text-anchor="middle" fill="#f6c75a" font-size="14" font-weight="900">1</text>
        <text x="44" y="13" fill="#f8fafc" font-size="12" font-weight="800">LEVEL FIRST</text>
        <text x="44" y="30" fill="#91a1b6" font-size="11">define boundary</text>
      </g>
      <path d="M226 32h50" stroke="#5f7797" stroke-width="2"/>
      <g transform="translate(292 16)">
        <circle cx="16" cy="16" r="16" fill="#54d3ff" fill-opacity="0.14" stroke="#54d3ff" stroke-opacity="0.5"/>
        <text x="16" y="21" text-anchor="middle" fill="#54d3ff" font-size="14" font-weight="900">2</text>
        <text x="44" y="13" fill="#f8fafc" font-size="12" font-weight="800">EVIDENCE NEXT</text>
        <text x="44" y="30" fill="#91a1b6" font-size="11">accept or reject</text>
      </g>
      <path d="M498 32h50" stroke="#5f7797" stroke-width="2"/>
      <g transform="translate(564 16)">
        <circle cx="16" cy="16" r="16" fill="#4ade80" fill-opacity="0.14" stroke="#4ade80" stroke-opacity="0.5"/>
        <text x="16" y="21" text-anchor="middle" fill="#4ade80" font-size="14" font-weight="900">3</text>
        <text x="44" y="13" fill="#f8fafc" font-size="12" font-weight="800">RISK LAST</text>
        <text x="44" y="30" fill="#91a1b6" font-size="11">valid stop, then size</text>
      </g>
    </g>

    <text x="58" y="657" fill="#73839a" font-size="12">Educational illustration. Neither path is guaranteed; fills, liquidity and subsequent structure can differ.</text>
  </g>
</svg>
