<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Liquidity and execution map</title><desc id="desc">A diagram showing how order size, spread, displayed depth and changing conditions affect estimated execution cost.</desc><rect width="1200" height="720" rx="34" fill="#071827"/><text x="70" y="78" fill="#f4f8fb" font-family="Arial, sans-serif" font-size="31" font-weight="700">Liquidity is a measurement at a stated size and moment</text><text x="70" y="108" fill="#aabfd1" font-family="Arial, sans-serif" font-size="18">A narrow spread alone does not establish the cost of completing your full order.</text><g font-family="Arial, sans-serif"><g><rect x="70" y="180" width="230" height="130" rx="18" fill="#0d2b42" stroke="#50d8ff" stroke-opacity=".65"/><text x="98" y="226" fill="#50d8ff" font-size="18" font-weight="700">ORDER CONTEXT</text><text x="98" y="260" fill="#e6f0f7" font-size="21">Side + stated size</text><text x="98" y="288" fill="#aabfd1" font-size="16">instrument · venue · time</text></g><g><rect x="420" y="150" width="260" height="94" rx="18" fill="#112d43"/><text x="450" y="190" fill="#f6c75a" font-size="18" font-weight="700">SPREAD</text><text x="450" y="219" fill="#dfeaf3" font-size="18">best displayed prices</text></g><g><rect x="420" y="293" width="260" height="94" rx="18" fill="#112d43"/><text x="450" y="333" fill="#62e6a0" font-size="18" font-weight="700">DEPTH</text><text x="450" y="362" fill="#dfeaf3" font-size="18">levels available to size</text></g><g><rect x="420" y="436" width="260" height="94" rx="18" fill="#112d43"/><text x="450" y="476" fill="#fb7185" font-size="18" font-weight="700">CONDITIONS</text><text x="450" y="505" fill="#dfeaf3" font-size="18">session · event · volatility</text></g><g><rect x="835" y="250" width="285" height="175" rx="22" fill="#0f3947" stroke="#62e6a0" stroke-opacity=".7"/><text x="870" y="298" fill="#62e6a0" font-size="19" font-weight="700">ESTIMATED EXECUTION</text><text x="870" y="338" fill="#f4f8fb" font-size="27" font-weight="700">cost to trade</text><text x="870" y="370" fill="#c0d2df" font-size="17">fees + expected slippage</text><text x="870" y="396" fill="#c0d2df" font-size="17">not a guaranteed fill</text></g><path d="M300 245H385M300 245L385 340M300 245L385 482" stroke="#50d8ff" stroke-width="5" fill="none"/><path d="M680 197H800M680 340H800M680 483H800" stroke="#62e6a0" stroke-width="5" fill="none"/><path d="M380 235l14 10-14 10M795 187l14 10-14 10M795 330l14 10-14 10M795 473l14 10-14 10" fill="none" stroke="#62e6a0" stroke-width="4"/><rect x="70" y="594" width="1050" height="56" rx="16" fill="#0a2134"/><text x="100" y="629" fill="#dce8f2" font-family="Arial, sans-serif" font-size="18">Displayed depth can change, cancel, or execute before an order reaches it. Recheck conditions rather than treating the diagram as a live quote.</text></g></svg>
