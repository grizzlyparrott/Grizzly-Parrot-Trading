<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">NinjaTrader template map</title><desc id="desc">A conceptual diagram separates a chart template from a workspace, Data Series presets, indicator templates, strategy templates, and drawing templates.</desc><rect width="1200" height="720" rx="34" fill="#071827"/><g font-family="Arial, sans-serif"><text x="70" y="76" fill="#f4f8fb" font-size="31" font-weight="700">Choose the object you actually need to save</text><text x="70" y="106" fill="#aabfd1" font-size="18">Conceptual map based on NinjaTrader 8 documentation; menu labels and behavior can vary by build.</text><rect x="386" y="232" width="430" height="180" rx="24" fill="#123a4d" stroke="#62e6a0" stroke-opacity=".78"/><text x="425" y="285" fill="#62e6a0" font-size="20" font-weight="700">CHART TEMPLATE</text><text x="425" y="326" fill="#f5f9fc" font-size="23">chart + panel properties</text><text x="425" y="360" fill="#c4d5df" font-size="18">indicator settings · same Data Series count</text><g fill="#0e2c42" stroke="#50d8ff" stroke-opacity=".55"><rect x="70" y="200" width="220" height="94" rx="16"/><rect x="70" y="430" width="220" height="94" rx="16"/><rect x="910" y="200" width="220" height="94" rx="16"/><rect x="910" y="430" width="220" height="94" rx="16"/></g><text x="98" y="241" fill="#50d8ff" font-size="17" font-weight="700">WORKSPACE</text><text x="98" y="269" fill="#dbe8f1" font-size="17">window collection + state</text><text x="98" y="471" fill="#50d8ff" font-size="17" font-weight="700">DATA SERIES PRESET</text><text x="98" y="499" fill="#dbe8f1" font-size="17">series configuration</text><text x="938" y="241" fill="#50d8ff" font-size="17" font-weight="700">INDICATOR TEMPLATE</text><text x="938" y="269" fill="#dbe8f1" font-size="17">indicator settings</text><text x="938" y="471" fill="#50d8ff" font-size="17" font-weight="700">DRAWING TEMPLATE</text><text x="938" y="499" fill="#dbe8f1" font-size="17">drawing object style</text><path d="M290 247H360M290 477H360M840 247H910M840 477H910" stroke="#50d8ff" stroke-width="4" stroke-dasharray="8 8"/><text x="70" y="614" fill="#f6c75a" font-size="18" font-weight="700">Compatibility check:</text><text x="280" y="614" fill="#dce8f2" font-size="18">confirm the source and destination charts have the same number of Data Series before loading.</text></g></svg>
