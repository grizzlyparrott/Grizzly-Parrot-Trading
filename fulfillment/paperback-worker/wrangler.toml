name = "grizzly-parrot-paperback"
main = "src/index.mjs"
compatibility_date = "2026-07-20"
workers_dev = true
keep_vars = true

# Production is configured. Existing books retain their established global
# proof approvals; release-keyed titles additionally require their own scoped
# direct-sales approval and cannot inherit another title's state.
[vars]
PAPERBACK_SALES_ENABLED = "true"
HARDCOVER_SALES_ENABLED = "true"
PAPERBACK_PRIVATE_ORDER_ENABLED = "false"
PAPERBACK_PROOFS_APPROVED = "true"
HARDCOVER_PROOFS_APPROVED = "true"
PAPERBACK_POLICIES_APPROVED = "true"
PAPERBACK_ALLOWED_COUNTRIES = "US"
# Stripe Tax is enabled in Checkout. Stripe calculates tax only for locations
# with an active registration in the Stripe dashboard.
PAPERBACK_STRIPE_TAX_ENABLED = "true"
PAPERBACK_ENVIRONMENT = "production"
PAPERBACK_BASE_URL = "https://grizzly-parrot-paperback.grizzlyparrott04.workers.dev"
PAPERBACK_SUCCESS_URL = "https://grizzlyparrottrading.com/books/paperback-order-confirmation.html"
PAPERBACK_CANCEL_URL = "https://grizzlyparrottrading.com/books/"
PAPERBACK_ALLOWED_ORIGIN = "https://grizzlyparrottrading.com"
MICROSOFT_UET_TAG_ID = "97257755"
EMAIL_FROM = "Grizzly Parrot Trading <orders@grizzlyparrottrading.com>"
DIGITAL_EMAIL_FROM = "Grizzly Parrot Trading <sales@grizzlyparrottrading.com>"
DIGITAL_REPLY_TO = "sales@grizzlyparrottrading.com"
SHOP_CONTACT_EMAIL = "orders@grizzlyparrottrading.com"
ADMIN_EMAIL = "grizzlyparrott04@gmail.com"

STRIPE_PAYMENT_LINK_CURRENCY_DIGITAL = "plink_1T6ckkIA3p8RBkZIbTKBQpYh"
STRIPE_PAYMENT_LINK_METALS_DIGITAL = "plink_1TDVahIA3p8RBkZIweogwKgN"
STRIPE_PAYMENT_LINK_EQUITY_DIGITAL = "plink_1TvLgXIA3p8RBkZIZ0x8nKlu"
STRIPE_PAYMENT_LINK_PROBABILISTIC_DIGITAL = "plink_1U3l6oIA3p8RBkZIwwzIcM95"
STRIPE_CHECKOUT_URL_PROBABILISTIC_DIGITAL = "https://buy.stripe.com/3cIdRabKd6gm8hydHq2Nq04"

STRIPE_PRICE_CURRENCY_PAPERBACK = "price_1Tvc5kIA3p8RBkZIifTkKIps"
STRIPE_PRICE_METALS_PAPERBACK = "price_1TvcfHIA3p8RBkZICIkp2C8c"
STRIPE_PRICE_EQUITY_PAPERBACK = "price_1TvchoIA3p8RBkZI74lfin4W"
STRIPE_PRICE_CURRENCY_HARDCOVER = "price_1U0r1aIA3p8RBkZI5koICIGI"
STRIPE_PRICE_METALS_HARDCOVER = "price_1U0qwrIA3p8RBkZIjgMBc1YF"
STRIPE_PRICE_EQUITY_HARDCOVER = "price_1U0r01IA3p8RBkZIPBv0lOpM"
STRIPE_PRICE_PROBABILISTIC_PAPERBACK = "price_1U3lIEIA3p8RBkZIFBnsS6FG"
STRIPE_PRICE_PROBABILISTIC_HARDCOVER = "price_1U3lJYIA3p8RBkZICjKLQtt0"

# Probabilistic Execution digital delivery and Grizzly direct-site print sales
# are approved. Physical-proof state remains false and separate because the
# proofs have not been received; it is not required by Lulu's Print API.
PROBABILISTIC_EXECUTION_DIGITAL_SALES_ENABLED = "true"
PROBABILISTIC_EXECUTION_DIGITAL_DELIVERY_ENABLED = "true"
PROBABILISTIC_EXECUTION_PAPERBACK_FILES_VALIDATED = "true"
PROBABILISTIC_EXECUTION_PAPERBACK_PROOF_APPROVED = "false"
PROBABILISTIC_EXECUTION_PAPERBACK_DIRECT_SALES_APPROVED = "true"
PROBABILISTIC_EXECUTION_PAPERBACK_PRIVATE_ORDER_ENABLED = "false"
PROBABILISTIC_EXECUTION_PAPERBACK_SALES_ENABLED = "true"
PROBABILISTIC_EXECUTION_HARDCOVER_FILES_VALIDATED = "true"
PROBABILISTIC_EXECUTION_HARDCOVER_PROOF_APPROVED = "false"
PROBABILISTIC_EXECUTION_HARDCOVER_DIRECT_SALES_APPROVED = "true"
PROBABILISTIC_EXECUTION_HARDCOVER_PRIVATE_ORDER_ENABLED = "false"
PROBABILISTIC_EXECUTION_HARDCOVER_SALES_ENABLED = "true"

[[d1_databases]]
binding = "PAPERBACK_ORDERS"
database_name = "grizzly-parrot-paperback-orders"
database_id = "2811729d-86b6-45a1-a140-df0d5c02843a"

[[r2_buckets]]
binding = "PRINT_ASSETS"
bucket_name = "grizzly-parrot-print-assets"

[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

# Encrypted dashboard secrets deliberately do not appear here:
# STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, LULU_CLIENT_KEY,
# LULU_CLIENT_SECRET, RESEND_API_KEY, PAPERBACK_ASSET_SIGNING_SECRET,
# and PAPERBACK_PRIVATE_ORDER_TOKEN. PAPERBACK_TEST_TOKEN is sandbox-only.

[secrets]
required = [
  "STRIPE_SECRET_KEY",
  "STRIPE_WEBHOOK_SECRET",
  "LULU_CLIENT_KEY",
  "LULU_CLIENT_SECRET",
  "RESEND_API_KEY",
  "PAPERBACK_ASSET_SIGNING_SECRET",
  "PAPERBACK_PRIVATE_ORDER_TOKEN"
]
