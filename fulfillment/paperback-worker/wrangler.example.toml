name = "grizzly-parrot-paperback-fulfillment"
main = "src/index.mjs"
compatibility_date = "2026-07-20"
workers_dev = true

# Deliberately safe defaults.  A deployment cannot accept a production paperback
# checkout until PAPERBACK_SALES_ENABLED is explicitly changed to "true".
[vars]
PAPERBACK_SALES_ENABLED = "false"
HARDCOVER_SALES_ENABLED = "false"
PAPERBACK_PRIVATE_ORDER_ENABLED = "false"
PAPERBACK_PROOFS_APPROVED = "false"
HARDCOVER_PROOFS_APPROVED = "false"
PAPERBACK_POLICIES_APPROVED = "false"
PAPERBACK_ALLOWED_COUNTRIES = "US"
PAPERBACK_FLAT_RATE_US_CENTS = "749"
PAPERBACK_FLAT_RATE_INTERNATIONAL_CENTS = "1999"
# Optional comma-separated override. When omitted, checkout offers every Stripe
# destination that Lulu currently lists as shippable.
PAPERBACK_INTERNATIONAL_COUNTRIES = ""
PAPERBACK_STRIPE_TAX_ENABLED = "false"
PAPERBACK_ENVIRONMENT = "sandbox"
PAPERBACK_BASE_URL = "https://YOUR-WORKER.YOUR-SUBDOMAIN.workers.dev"
PAPERBACK_SUCCESS_URL = "https://grizzlyparrottrading.com/books/paperback-order-confirmation.html"
PAPERBACK_CANCEL_URL = "https://grizzlyparrottrading.com/books/"
PAPERBACK_ALLOWED_ORIGIN = "https://grizzlyparrottrading.com"
EMAIL_FROM = "Grizzly Parrot Trading <orders@example.com>"
DIGITAL_EMAIL_FROM = "Grizzly Parrot Trading <sales@example.com>"
DIGITAL_REPLY_TO = "sales@example.com"
SHOP_CONTACT_EMAIL = "orders@example.com"
ADMIN_EMAIL = ""

STRIPE_PAYMENT_LINK_PROBABILISTIC_DIGITAL = "plink_REPLACE_PROBABILISTIC_DIGITAL"
STRIPE_CHECKOUT_URL_PROBABILISTIC_DIGITAL = "https://buy.stripe.com/REPLACE_PROBABILISTIC_DIGITAL"

# Stripe sandbox prices created on 2026-07-20. Price IDs are not secrets.
# Replace all three with newly created live Stripe Price IDs before a production launch.
STRIPE_PRICE_CURRENCY_PAPERBACK = "price_1TvNP4IA3p8RBkZIKlVaLG4V"
STRIPE_PRICE_METALS_PAPERBACK = "price_1TvNQ3IA3p8RBkZIretIKedz"
STRIPE_PRICE_EQUITY_PAPERBACK = "price_1TvNQrIA3p8RBkZI4SmXnkjj"
STRIPE_PRICE_CURRENCY_HARDCOVER = "price_REPLACE_CURRENCY_HARDCOVER"
STRIPE_PRICE_METALS_HARDCOVER = "price_REPLACE_METALS_HARDCOVER"
STRIPE_PRICE_EQUITY_HARDCOVER = "price_REPLACE_EQUITY_HARDCOVER"
STRIPE_PRICE_PROBABILISTIC_PAPERBACK = "price_REPLACE_PROBABILISTIC_PAPERBACK"
STRIPE_PRICE_PROBABILISTIC_HARDCOVER = "price_REPLACE_PROBABILISTIC_HARDCOVER"

# Title-specific release gates. Never replace a false value until the named
# checkpoint is actually complete for Probabilistic Execution.
PROBABILISTIC_EXECUTION_DIGITAL_SALES_ENABLED = "false"
PROBABILISTIC_EXECUTION_DIGITAL_DELIVERY_ENABLED = "false"
PROBABILISTIC_EXECUTION_PAPERBACK_FILES_VALIDATED = "false"
PROBABILISTIC_EXECUTION_PAPERBACK_PROOF_APPROVED = "false"
PROBABILISTIC_EXECUTION_PAPERBACK_DIRECT_SALES_APPROVED = "false"
PROBABILISTIC_EXECUTION_PAPERBACK_PRIVATE_ORDER_ENABLED = "false"
PROBABILISTIC_EXECUTION_PAPERBACK_SALES_ENABLED = "false"
PROBABILISTIC_EXECUTION_HARDCOVER_FILES_VALIDATED = "false"
PROBABILISTIC_EXECUTION_HARDCOVER_PROOF_APPROVED = "false"
PROBABILISTIC_EXECUTION_HARDCOVER_DIRECT_SALES_APPROVED = "false"
PROBABILISTIC_EXECUTION_HARDCOVER_PRIVATE_ORDER_ENABLED = "false"
PROBABILISTIC_EXECUTION_HARDCOVER_SALES_ENABLED = "false"

# Create these resources in Cloudflare, then replace the placeholders only in
# the real wrangler.toml / dashboard configuration. Do not commit that file.
[[d1_databases]]
binding = "PAPERBACK_ORDERS"
database_name = "grizzly-parrot-paperback-orders"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "PRINT_ASSETS"
bucket_name = "grizzly-parrot-print-assets"

[triggers]
crons = ["*/15 * * * *"]

# Secrets: STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, LULU_CLIENT_KEY,
# LULU_CLIENT_SECRET, RESEND_API_KEY, PAPERBACK_TEST_TOKEN, and
# PAPERBACK_ASSET_SIGNING_SECRET, and PAPERBACK_PRIVATE_ORDER_TOKEN.

[secrets]
required = [
  "STRIPE_SECRET_KEY",
  "STRIPE_WEBHOOK_SECRET",
  "LULU_CLIENT_KEY",
  "LULU_CLIENT_SECRET",
  "RESEND_API_KEY",
  "PAPERBACK_TEST_TOKEN",
  "PAPERBACK_ASSET_SIGNING_SECRET",
  "PAPERBACK_PRIVATE_ORDER_TOKEN"
]
