<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-labelledby="title desc">
  <title id="title">Four futures ticks make one point in ES and MES</title>
  <desc id="desc">A price ladder moves from 5000 to 5001 in four quarter-point ticks. ES is worth 12 dollars and 50 cents per tick or 50 dollars per point. MES is worth 1 dollar and 25 cents per tick or 5 dollars per point.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081521"/>
      <stop offset="0.55" stop-color="#0d2332"/>
      <stop offset="1" stop-color="#102d3b"/>
    </linearGradient>
    <linearGradient id="ladder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d3344"/>
      <stop offset="1" stop-color="#0b2938"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d7e6"/>
      <stop offset="1" stop-color="#68f0c4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#02080d" flood-opacity="0.45"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#8fd8e3" stroke-opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="960" height="680" rx="32" fill="url(#background)"/>
  <rect width="960" height="680" rx="32" fill="url(#grid)"/>
  <circle cx="120" cy="54" r="180" fill="#29cddd" opacity="0.06"/>
  <circle cx="888" cy="610" r="210" fill="#65edbe" opacity="0.05"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="64" y="72" fill="#8ed9e3" font-size="16" font-weight="700" letter-spacing="2.4">PRICE MOVEMENT, TRANSLATED</text>
    <text x="64" y="116" fill="#f5fbfc" font-size="35" font-weight="750">Ticks tell you the steps.</text>
    <text x="64" y="154" fill="#c6d9df" font-size="24">Tick value tells you the dollars.</text>

    <g filter="url(#shadow)">
      <rect x="58" y="194" width="504" height="342" rx="24" fill="#071721" stroke="#3dd4e2" stroke-opacity="0.28"/>
      <rect x="82" y="218" width="456" height="50" rx="13" fill="url(#accent)" opacity="0.13"/>
      <text x="104" y="249" fill="#8ce8ee" font-size="15" font-weight="700" letter-spacing="1.8">PRICE LADDER</text>
      <text x="500" y="249" fill="#9db8c1" font-size="14" text-anchor="end">0.25 tick size</text>

      <g font-size="19" font-weight="700">
        <rect x="82" y="286" width="456" height="42" rx="9" fill="#163b47"/>
        <text x="106" y="313" fill="#f4fbfc">5001.00</text>
        <text x="510" y="313" fill="#6cebc5" font-size="14" text-anchor="end">+1.00 point</text>

        <rect x="82" y="337" width="456" height="42" rx="9" fill="url(#ladder)"/>
        <text x="106" y="364" fill="#e4f0f3">5000.75</text>
        <text x="510" y="364" fill="#90aeb8" font-size="14" text-anchor="end">tick 3</text>

        <rect x="82" y="388" width="456" height="42" rx="9" fill="url(#ladder)"/>
        <text x="106" y="415" fill="#e4f0f3">5000.50</text>
        <text x="510" y="415" fill="#90aeb8" font-size="14" text-anchor="end">tick 2</text>

        <rect x="82" y="439" width="456" height="42" rx="9" fill="url(#ladder)"/>
        <text x="106" y="466" fill="#e4f0f3">5000.25</text>
        <text x="510" y="466" fill="#90aeb8" font-size="14" text-anchor="end">tick 1</text>

        <rect x="82" y="490" width="456" height="42" rx="9" fill="#102c39" stroke="#6cebc5" stroke-opacity="0.32"/>
        <text x="106" y="517" fill="#f4fbfc">5000.00</text>
        <text x="510" y="517" fill="#90aeb8" font-size="14" text-anchor="end">starting price</text>
      </g>

      <path d="M58 365H32M32 365v-79m0 0 10 14m-10-14-10 14" fill="none" stroke="#f6b95b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="20" y="386" fill="#f6c36f" font-size="13" font-weight="700" transform="rotate(-90 20 386)">4 TICKS = 1 POINT</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="594" y="194" width="308" height="158" rx="24" fill="#0c2836" stroke="#39d7e6" stroke-opacity="0.42"/>
      <rect x="618" y="218" width="54" height="30" rx="8" fill="#39d7e6" opacity="0.16"/>
      <text x="645" y="239" fill="#70e6ef" font-size="15" font-weight="800" text-anchor="middle">ES</text>
      <text x="618" y="280" fill="#f5fbfc" font-size="26" font-weight="750">$12.50</text>
      <text x="726" y="280" fill="#9db8c1" font-size="15">per tick</text>
      <path d="M618 299H878" stroke="#82bac5" stroke-opacity="0.22"/>
      <text x="618" y="329" fill="#f5c46f" font-size="18" font-weight="750">$50 per point</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="594" y="376" width="308" height="158" rx="24" fill="#0c2836" stroke="#68f0c4" stroke-opacity="0.42"/>
      <rect x="618" y="400" width="66" height="30" rx="8" fill="#68f0c4" opacity="0.14"/>
      <text x="651" y="421" fill="#8af3d1" font-size="15" font-weight="800" text-anchor="middle">MES</text>
      <text x="618" y="462" fill="#f5fbfc" font-size="26" font-weight="750">$1.25</text>
      <text x="711" y="462" fill="#9db8c1" font-size="15">per tick</text>
      <path d="M618 481H878" stroke="#82bac5" stroke-opacity="0.22"/>
      <text x="618" y="511" fill="#78edc9" font-size="18" font-weight="750">$5 per point</text>
    </g>

    <g>
      <rect x="58" y="574" width="844" height="70" rx="20" fill="#071721" stroke="#82dfe7" stroke-opacity="0.22"/>
      <text x="88" y="617" fill="#c5d9df" font-size="18" font-weight="650">ticks</text>
      <text x="156" y="617" fill="#5edee8" font-size="22" font-weight="800">×</text>
      <text x="188" y="617" fill="#c5d9df" font-size="18" font-weight="650">tick value</text>
      <text x="292" y="617" fill="#5edee8" font-size="22" font-weight="800">×</text>
      <text x="324" y="617" fill="#c5d9df" font-size="18" font-weight="650">contracts</text>
      <text x="429" y="617" fill="#5edee8" font-size="22" font-weight="800">=</text>
      <text x="468" y="617" fill="#f5fbfc" font-size="21" font-weight="800">dollar movement</text>
      <rect x="712" y="592" width="162" height="34" rx="17" fill="#68f0c4" opacity="0.14"/>
      <text x="793" y="615" fill="#8af3d1" font-size="13" font-weight="800" letter-spacing="1.1" text-anchor="middle">CONTRACT-SPECIFIC</text>
    </g>
  </g>
</svg>
