<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-labelledby="title desc">
  <title id="title">How expected US and euro interest-rate paths feed into Euro FX futures</title>
  <desc id="desc">A conceptual diagram showing separate expected dollar and euro rate paths, the gap between them, and two transmission channels into Euro FX futures: spot repricing and forward points.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#122542"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="gap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa" stop-opacity=".28"/>
      <stop offset="1" stop-color="#45de84" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="contract" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173557"/>
      <stop offset="1" stop-color="#0c1d32"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".32"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8ca7c7"/>
    </marker>
  </defs>

  <rect width="960" height="680" rx="28" fill="url(#bg)"/>
  <g opacity=".13" stroke="#a7b9ce" stroke-width="1">
    <path d="M70 80H890M70 145H890M70 210H890M70 275H890M70 340H890M70 405H890M70 470H890M70 535H890M70 600H890"/>
    <path d="M90 60V620M190 60V620M290 60V620M390 60V620M490 60V620M590 60V620M690 60V620M790 60V620M890 60V620"/>
  </g>

  <text x="70" y="66" fill="#71ee9b" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">EXPECTED RATE PATHS, NOT JUST TODAY'S RATE</text>
  <text x="70" y="103" fill="#f4f8fd" font-family="Arial, sans-serif" font-size="30" font-weight="800">The relative path is the signal</text>

  <g transform="translate(70 135)">
    <rect width="520" height="275" rx="20" fill="#09182a" stroke="#2a4564"/>
    <path d="M42 218 C120 196 162 158 225 154 S338 111 470 82 L470 179 C356 194 290 201 225 209 S111 226 42 234 Z" fill="url(#gap)"/>
    <path d="M42 218 C120 196 162 158 225 154 S338 111 470 82" fill="none" stroke="#69adff" stroke-width="7" stroke-linecap="round"/>
    <path d="M42 234 C118 226 166 216 225 209 S350 193 470 179" fill="none" stroke="#4ce18a" stroke-width="7" stroke-linecap="round"/>
    <g fill="#69adff">
      <circle cx="42" cy="218" r="7"/><circle cx="225" cy="154" r="7"/><circle cx="470" cy="82" r="7"/>
    </g>
    <g fill="#4ce18a">
      <circle cx="42" cy="234" r="7"/><circle cx="225" cy="209" r="7"/><circle cx="470" cy="179" r="7"/>
    </g>
    <text x="332" y="58" fill="#9dcaff" font-family="Arial, sans-serif" font-size="17" font-weight="700">USD funding path</text>
    <text x="322" y="217" fill="#83f0a9" font-family="Arial, sans-serif" font-size="17" font-weight="700">EUR funding path</text>
    <path d="M260 166V198" stroke="#f6c85f" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="274" y="188" fill="#f6d77f" font-family="Arial, sans-serif" font-size="15" font-weight="700">differential</text>
    <text x="42" y="258" fill="#8ea4bd" font-family="Arial, sans-serif" font-size="14">NOW</text>
    <text x="432" y="258" fill="#8ea4bd" font-family="Arial, sans-serif" font-size="14">EXPIRY</text>
  </g>

  <g transform="translate(635 144)" filter="url(#shadow)">
    <rect width="255" height="108" rx="18" fill="#10233b" stroke="#365777"/>
    <circle cx="36" cy="36" r="15" fill="#60a5fa" fill-opacity=".18" stroke="#75b5ff"/>
    <path d="M29 36h14M36 29v14" stroke="#9ac7ff" stroke-width="2"/>
    <text x="65" y="40" fill="#f7fbff" font-family="Arial, sans-serif" font-size="19" font-weight="800">SPOT REPRICING</text>
    <text x="28" y="75" fill="#9cafc4" font-family="Arial, sans-serif" font-size="15">Policy-path surprise and risk flows</text>
  </g>

  <g transform="translate(635 279)" filter="url(#shadow)">
    <rect width="255" height="108" rx="18" fill="#10233b" stroke="#365777"/>
    <circle cx="36" cy="36" r="15" fill="#45de84" fill-opacity=".16" stroke="#68e897"/>
    <path d="M28 40l7-8 6 5 7-10" fill="none" stroke="#8af0ad" stroke-width="2"/>
    <text x="65" y="40" fill="#f7fbff" font-family="Arial, sans-serif" font-size="19" font-weight="800">FORWARD POINTS</text>
    <text x="28" y="75" fill="#9cafc4" font-family="Arial, sans-serif" font-size="15">Matched-maturity cost of carry</text>
  </g>

  <path d="M590 248H620" stroke="#8ca7c7" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M590 318H620" stroke="#8ca7c7" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M763 405V448" stroke="#8ca7c7" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(370 468)" filter="url(#shadow)">
    <rect width="520" height="126" rx="22" fill="url(#contract)" stroke="#3a5c80"/>
    <rect x="24" y="24" width="108" height="78" rx="14" fill="#071321" stroke="#2e4e70"/>
    <text x="78" y="59" text-anchor="middle" fill="#75eba0" font-family="Arial, sans-serif" font-size="31" font-weight="900">6E</text>
    <text x="78" y="83" text-anchor="middle" fill="#9eb0c4" font-family="Arial, sans-serif" font-size="12" letter-spacing="1">USD / EUR</text>
    <text x="160" y="57" fill="#f8fbff" font-family="Arial, sans-serif" font-size="23" font-weight="800">EURO FX FUTURES</text>
    <text x="160" y="87" fill="#a8b9cc" font-family="Arial, sans-serif" font-size="16">Spot move + carry + basis + daily settlement</text>
  </g>

  <g transform="translate(70 468)">
    <rect width="255" height="126" rx="20" fill="#0a1727" stroke="#2a4564"/>
    <text x="24" y="35" fill="#f6d77f" font-family="Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1">THE NON-NEGOTIABLE DISTINCTION</text>
    <text x="24" y="66" fill="#f6f9fd" font-family="Arial, sans-serif" font-size="18" font-weight="700">Forward premium</text>
    <text x="24" y="91" fill="#9fb1c4" font-family="Arial, sans-serif" font-size="15">is not a spot-price forecast.</text>
  </g>

  <text x="70" y="642" fill="#8fa4bc" font-family="Arial, sans-serif" font-size="14">Conceptual illustration. Actual contract pricing uses market rates, exact dates, basis and futures settlement conventions.</text>
</svg>
