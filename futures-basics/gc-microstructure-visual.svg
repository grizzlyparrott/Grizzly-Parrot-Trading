<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">GC gold futures order-book mechanics</title>
  <desc id="desc">An educational diagram showing displayed ask and bid depth, a marketable buy order consuming offers, a limit-order queue, and the distinction between resting liquidity and executed trades.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1524"/>
      <stop offset="1" stop-color="#030812"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8df8b"/>
      <stop offset="1" stop-color="#d5a934"/>
    </linearGradient>
    <linearGradient id="buy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ade80" stop-opacity=".14"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity=".36"/>
    </linearGradient>
    <linearGradient id="sell" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb7185" stop-opacity=".36"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity=".14"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000814" flood-opacity=".58"/>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#8ca2bd" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="800" rx="28" fill="url(#grid)"/>
  <circle cx="1040" cy="110" r="210" fill="#f4c95d" opacity=".05"/>
  <circle cx="125" cy="690" r="240" fill="#60a5fa" opacity=".045"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="64" y="66" fill="#f4c95d" font-size="18" font-weight="800" letter-spacing="3">GC AUCTION MECHANICS</text>
    <text x="64" y="112" fill="#f8fafc" font-size="38" font-weight="800" letter-spacing="-1.5">Resting liquidity becomes a trade</text>
    <text x="64" y="145" fill="#93a4ba" font-size="18">The book is a changing state. Time and sales is the execution record.</text>

    <g transform="translate(64 194)" filter="url(#shadow)">
      <rect width="610" height="510" rx="22" fill="#07101d" stroke="#687b93" stroke-opacity=".28"/>
      <text x="30" y="42" fill="#f7f9fc" font-size="20" font-weight="750">Displayed GC order book</text>
      <text x="580" y="42" fill="#7f90a6" font-size="14" text-anchor="end">hypothetical quantity</text>

      <g transform="translate(30 70)">
        <rect width="550" height="54" rx="10" fill="url(#sell)" stroke="#fb7185" stroke-opacity=".28"/>
        <rect x="0" y="0" width="116" height="54" rx="10" fill="#210f1a" opacity=".8"/>
        <text x="18" y="34" fill="#fecdd3" font-size="18" font-weight="700">2,426.4</text>
        <text x="150" y="34" fill="#a9b7ca" font-size="15">ASK QUEUE</text>
        <rect x="272" y="17" width="208" height="20" rx="10" fill="#fb7185" opacity=".28"/>
        <rect x="272" y="17" width="132" height="20" rx="10" fill="#fb7185" opacity=".72"/>
        <text x="522" y="34" fill="#fecdd3" font-size="18" font-weight="800" text-anchor="end">412</text>

        <rect y="64" width="550" height="54" rx="10" fill="url(#sell)" stroke="#fb7185" stroke-opacity=".42"/>
        <rect x="0" y="64" width="116" height="54" rx="10" fill="#2a101c" opacity=".86"/>
        <text x="18" y="98" fill="#fff1f2" font-size="18" font-weight="800">2,426.3</text>
        <text x="150" y="98" fill="#fecdd3" font-size="15" font-weight="700">BEST ASK</text>
        <rect x="272" y="81" width="208" height="20" rx="10" fill="#fb7185" opacity=".25"/>
        <rect x="272" y="81" width="84" height="20" rx="10" fill="#fb7185" opacity=".9"/>
        <text x="522" y="98" fill="#fff1f2" font-size="18" font-weight="800" text-anchor="end">263</text>

        <g transform="translate(0 130)">
          <rect width="550" height="62" rx="10" fill="#101b2a" stroke="#f4c95d" stroke-opacity=".36"/>
          <line x1="116" y1="0" x2="116" y2="62" stroke="#f4c95d" stroke-opacity=".18"/>
          <text x="18" y="25" fill="#f4c95d" font-size="12" font-weight="800" letter-spacing="1.6">SPREAD</text>
          <text x="18" y="46" fill="#ffe8a8" font-size="17" font-weight="800">1 TICK</text>
          <path d="M158 31 H455" fill="none" stroke="#f4c95d" stroke-opacity=".36" stroke-dasharray="7 8"/>
          <text x="522" y="38" fill="#f4c95d" font-size="14" font-weight="800" text-anchor="end">$10 / GC</text>
        </g>

        <rect y="204" width="550" height="54" rx="10" fill="url(#buy)" stroke="#4ade80" stroke-opacity=".42"/>
        <rect x="0" y="204" width="116" height="54" rx="10" fill="#092219" opacity=".86"/>
        <text x="18" y="238" fill="#f0fdf4" font-size="18" font-weight="800">2,426.2</text>
        <text x="150" y="238" fill="#bbf7d0" font-size="15" font-weight="700">BEST BID</text>
        <rect x="272" y="221" width="208" height="20" rx="10" fill="#4ade80" opacity=".24"/>
        <rect x="272" y="221" width="156" height="20" rx="10" fill="#4ade80" opacity=".75"/>
        <text x="522" y="238" fill="#f0fdf4" font-size="18" font-weight="800" text-anchor="end">487</text>

        <rect y="268" width="550" height="54" rx="10" fill="url(#buy)" stroke="#4ade80" stroke-opacity=".28"/>
        <rect x="0" y="268" width="116" height="54" rx="10" fill="#081e17" opacity=".8"/>
        <text x="18" y="302" fill="#dcfce7" font-size="18" font-weight="700">2,426.1</text>
        <text x="150" y="302" fill="#a9b7ca" font-size="15">BID QUEUE</text>
        <rect x="272" y="285" width="208" height="20" rx="10" fill="#4ade80" opacity=".22"/>
        <rect x="272" y="285" width="104" height="20" rx="10" fill="#4ade80" opacity=".64"/>
        <text x="522" y="302" fill="#dcfce7" font-size="18" font-weight="800" text-anchor="end">326</text>
      </g>

      <g transform="translate(30 425)">
        <rect width="550" height="58" rx="12" fill="#030913" stroke="#60a5fa" stroke-opacity=".32"/>
        <text x="18" y="23" fill="#8fc6ff" font-size="12" font-weight="800" letter-spacing="1.5">QUEUE EXAMPLE</text>
        <rect x="18" y="32" width="316" height="11" rx="5.5" fill="#334155"/>
        <rect x="18" y="32" width="235" height="11" rx="5.5" fill="#64748b"/>
        <rect x="253" y="29" width="55" height="17" rx="8.5" fill="url(#gold)"/>
        <text x="530" y="39" fill="#d7e1ee" font-size="14" font-weight="700" text-anchor="end">your limit order waits here</text>
      </g>
    </g>

    <g transform="translate(720 194)">
      <g filter="url(#shadow)">
        <rect width="416" height="166" rx="22" fill="#0a1422" stroke="#f4c95d" stroke-opacity=".28"/>
        <text x="26" y="35" fill="#f4c95d" font-size="13" font-weight="800" letter-spacing="2">INCOMING ORDER</text>
        <text x="26" y="74" fill="#f8fafc" font-size="25" font-weight="800">Marketable buy: 340 GC</text>
        <text x="26" y="105" fill="#96a6ba" font-size="16">263 trade at 2,426.3</text>
        <text x="26" y="132" fill="#96a6ba" font-size="16">77 continue to the next ask</text>
        <circle cx="354" cy="83" r="38" fill="#f4c95d" opacity=".12"/>
        <path d="M332 83 H372 M359 70 L372 83 359 96" fill="none" stroke="#f4c95d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <path d="M-32 82 H-5" fill="none" stroke="#f4c95d" stroke-width="4" stroke-linecap="round"/>
      <path d="M-13 70 L-1 82 -13 94" fill="none" stroke="#f4c95d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

      <g transform="translate(0 192)" filter="url(#shadow)">
        <rect width="416" height="186" rx="22" fill="#0a1422" stroke="#60a5fa" stroke-opacity=".28"/>
        <text x="26" y="35" fill="#60a5fa" font-size="13" font-weight="800" letter-spacing="2">EXECUTION RECORD</text>
        <g transform="translate(26 57)">
          <circle cx="7" cy="7" r="7" fill="#fb7185"/>
          <text x="27" y="13" fill="#f8fafc" font-size="17" font-weight="700">263 @ 2,426.3</text>
          <text x="365" y="13" fill="#fecdd3" font-size="14" text-anchor="end">ask consumed</text>
        </g>
        <g transform="translate(26 99)">
          <circle cx="7" cy="7" r="7" fill="#f4c95d"/>
          <text x="27" y="13" fill="#f8fafc" font-size="17" font-weight="700">77 @ 2,426.4</text>
          <text x="365" y="13" fill="#ffe7a3" font-size="14" text-anchor="end">price impact</text>
        </g>
        <line x1="26" y1="142" x2="390" y2="142" stroke="#64748b" stroke-opacity=".32"/>
        <text x="26" y="166" fill="#91a1b5" font-size="14">Volume records trades—not canceled quotes.</text>
      </g>

      <g transform="translate(0 404)">
        <rect width="416" height="106" rx="18" fill="#06101b" stroke="#4ade80" stroke-opacity=".23"/>
        <text x="24" y="31" fill="#4ade80" font-size="12" font-weight="800" letter-spacing="1.7">READING SEQUENCE</text>
        <text x="24" y="62" fill="#e6edf6" font-size="16" font-weight="700">State → trade → response → risk</text>
        <text x="24" y="86" fill="#8495aa" font-size="14">Observe first. Infer conditionally.</text>
      </g>
    </g>
  </g>
</svg>
