<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Open interest lifecycle</title><desc id="desc">A diagram shows new positions increasing open interest, both sides closing decreasing it, and transfer leaving it unchanged. It distinguishes open interest from volume and participant motive.</desc><rect width="1200" height="720" rx="34" fill="#071827"/><g font-family="Arial, sans-serif"><text x="70" y="76" fill="#f4f8fb" font-size="31" font-weight="700">Open interest counts contracts still open</text><text x="70" y="106" fill="#aabfd1" font-size="18">It is not a count of bullish traders, bearish traders, or dollars entering a market.</text><rect x="70" y="180" width="1060" height="64" rx="16" fill="#0e2e43"/><text x="106" y="220" fill="#dceaf3" font-size="20">Starting open interest: 100 contracts</text><g><rect x="70" y="310" width="300" height="190" rx="22" fill="#113449" stroke="#62e6a0" stroke-opacity=".7"/><text x="106" y="358" fill="#62e6a0" font-size="19" font-weight="700">BOTH SIDES OPEN</text><text x="106" y="400" fill="#f2f7fb" font-size="24">Open interest +1</text><text x="106" y="435" fill="#b7c8d5" font-size="17">one new long + one new short</text></g><g><rect x="450" y="310" width="300" height="190" rx="22" fill="#113449" stroke="#fb7185" stroke-opacity=".7"/><text x="486" y="358" fill="#fb7185" font-size="19" font-weight="700">BOTH SIDES CLOSE</text><text x="486" y="400" fill="#f2f7fb" font-size="24">Open interest −1</text><text x="486" y="435" fill="#b7c8d5" font-size="17">an existing long and short offset</text></g><g><rect x="830" y="310" width="300" height="190" rx="22" fill="#113449" stroke="#50d8ff" stroke-opacity=".7"/><text x="866" y="358" fill="#50d8ff" font-size="19" font-weight="700">POSITION TRANSFERS</text><text x="866" y="400" fill="#f2f7fb" font-size="24">Open interest 0</text><text x="866" y="435" fill="#b7c8d5" font-size="17">volume can rise while OI is unchanged</text></g><path d="M220 275v-22M600 275v-22M980 275v-22" stroke="#f6c75a" stroke-width="5"/><rect x="70" y="575" width="1060" height="58" rx="16" fill="#0a2134"/><text x="102" y="611" fill="#dce8f2" font-size="18">Published totals are aggregated. Price plus open interest may support a hypothesis, but it does not identify hedging, speculation, or direction.</text></g></svg>
