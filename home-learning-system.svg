<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Grizzly Parrot Trading decision system</title>
  <desc id="desc">A four-stage futures workflow moves from identifying the contract to pricing dollar risk, planning execution, and testing market context before reviewing the result.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset=".65" stop-color="#0b1727"/>
      <stop offset="1" stop-color="#07111c"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38d783"/>
      <stop offset="1" stop-color="#75f2ad"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e5ac42"/>
      <stop offset="1" stop-color="#ffd97a"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <rect width="1200" height="800" rx="42" fill="url(#bg)"/>
  <circle cx="1020" cy="120" r="170" fill="#42dc89" opacity=".09" filter="url(#soft)"/>
  <circle cx="176" cy="724" r="160" fill="#efba50" opacity=".06" filter="url(#soft)"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="64" y="72" fill="#6ff0a8" font-size="18" font-weight="800" letter-spacing="3">GRIZZLY PARROT LEARNING SYSTEM</text>
    <text x="64" y="114" fill="#f8fbff" font-size="32" font-weight="850">Build the trade decision in the right order</text>
    <text x="64" y="145" fill="#91a1b5" font-size="16">Instrument first. Dollar risk second. Execution and context before conviction.</text>

    <g>
      <rect x="64" y="194" width="244" height="170" rx="22" fill="#0e1d30" stroke="#263a51"/>
      <circle cx="96" cy="228" r="17" fill="#1c3a57"/>
      <text x="96" y="234" text-anchor="middle" fill="#b9cce0" font-size="14" font-weight="800">01</text>
      <text x="92" y="274" fill="#f8fbff" font-size="21" font-weight="800">Contract</text>
      <text x="92" y="305" fill="#8fa0b5" font-size="14">Unit · quote · tick value</text>
      <text x="92" y="328" fill="#8fa0b5" font-size="14">hours · expiry · settlement</text>
    </g>
    <path d="M318 279H346" stroke="#47617d" stroke-width="4" stroke-linecap="round"/>
    <path d="m340 270 10 9-10 9" fill="none" stroke="#47617d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g>
      <rect x="356" y="194" width="244" height="170" rx="22" fill="#102820" stroke="#2b6b50"/>
      <circle cx="388" cy="228" r="17" fill="url(#green)"/>
      <text x="388" y="234" text-anchor="middle" fill="#052014" font-size="14" font-weight="900">02</text>
      <text x="384" y="274" fill="#f8fbff" font-size="21" font-weight="800">Dollar risk</text>
      <text x="384" y="305" fill="#9fc8b1" font-size="14">stop ticks × tick value</text>
      <text x="384" y="328" fill="#9fc8b1" font-size="14">+ costs × contracts</text>
    </g>
    <path d="M610 279H638" stroke="#47617d" stroke-width="4" stroke-linecap="round"/>
    <path d="m632 270 10 9-10 9" fill="none" stroke="#47617d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g>
      <rect x="648" y="194" width="244" height="170" rx="22" fill="#291f12" stroke="#6c562d"/>
      <circle cx="680" cy="228" r="17" fill="url(#gold)"/>
      <text x="680" y="234" text-anchor="middle" fill="#2a1c04" font-size="14" font-weight="900">03</text>
      <text x="676" y="274" fill="#f8fbff" font-size="21" font-weight="800">Execution</text>
      <text x="676" y="305" fill="#c9b98f" font-size="14">spread · depth · queue</text>
      <text x="676" y="328" fill="#c9b98f" font-size="14">order type · slippage</text>
    </g>
    <path d="M902 279H930" stroke="#47617d" stroke-width="4" stroke-linecap="round"/>
    <path d="m924 270 10 9-10 9" fill="none" stroke="#47617d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g>
      <rect x="940" y="194" width="196" height="170" rx="22" fill="#0e1d30" stroke="#263a51"/>
      <circle cx="972" cy="228" r="17" fill="#1c3a57"/>
      <text x="972" y="234" text-anchor="middle" fill="#b9cce0" font-size="14" font-weight="800">04</text>
      <text x="968" y="274" fill="#f8fbff" font-size="21" font-weight="800">Context</text>
      <text x="968" y="305" fill="#8fa0b5" font-size="14">driver · location</text>
      <text x="968" y="328" fill="#8fa0b5" font-size="14">acceptance · invalidation</text>
    </g>

    <rect x="64" y="410" width="514" height="256" rx="24" fill="#0d1b2d" stroke="#20334a"/>
    <text x="92" y="450" fill="#aebbd0" font-size="14" font-weight="750" letter-spacing="1.4">THE SIZE GATE</text>
    <text x="92" y="490" fill="#f8fbff" font-size="23" font-weight="850">How many whole contracts fit?</text>
    <rect x="92" y="520" width="458" height="58" rx="15" fill="#12243a"/>
    <text x="112" y="555" fill="#72efaa" font-size="18" font-weight="800">floor(risk budget ÷ loss per contract)</text>
    <rect x="92" y="596" width="210" height="42" rx="12" fill="#123728" stroke="#2d7a55"/>
    <text x="197" y="622" text-anchor="middle" fill="#78f2ad" font-size="14" font-weight="800">SIZE FITS</text>
    <rect x="318" y="596" width="232" height="42" rx="12" fill="#391b22" stroke="#7c3a49"/>
    <text x="434" y="622" text-anchor="middle" fill="#ff9aa8" font-size="14" font-weight="800">OR SKIP THE TRADE</text>

    <rect x="610" y="410" width="526" height="256" rx="24" fill="#0d1b2d" stroke="#20334a"/>
    <text x="638" y="450" fill="#aebbd0" font-size="14" font-weight="750" letter-spacing="1.4">THE REVIEW LOOP</text>
    <g>
      <rect x="638" y="486" width="140" height="80" rx="16" fill="#12243a"/>
      <text x="708" y="518" text-anchor="middle" fill="#f8fbff" font-size="16" font-weight="800">Plan</text>
      <text x="708" y="542" text-anchor="middle" fill="#8295aa" font-size="12">before entry</text>
      <rect x="804" y="486" width="140" height="80" rx="16" fill="#12243a"/>
      <text x="874" y="518" text-anchor="middle" fill="#f8fbff" font-size="16" font-weight="800">Observe</text>
      <text x="874" y="542" text-anchor="middle" fill="#8295aa" font-size="12">fills + behavior</text>
      <rect x="970" y="486" width="138" height="80" rx="16" fill="#12243a"/>
      <text x="1039" y="518" text-anchor="middle" fill="#f8fbff" font-size="16" font-weight="800">Review</text>
      <text x="1039" y="542" text-anchor="middle" fill="#8295aa" font-size="12">process vs result</text>
    </g>
    <path d="M778 526H796M944 526H962" stroke="#4d6680" stroke-width="3" stroke-linecap="round"/>
    <path d="M1038 584c0 38-330 38-330 0" fill="none" stroke="#45d889" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8"/>
    <path d="m700 590 8-10 8 10" fill="none" stroke="#45d889" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="873" y="636" text-anchor="middle" fill="#72efaa" font-size="14" font-weight="750">Refine the process—not the story after the fact</text>

    <text x="64" y="730" fill="#f8fbff" font-size="21" font-weight="800">Education that turns market mechanics into explicit decisions.</text>
    <text x="64" y="760" fill="#74859a" font-size="14">No setup is complete until the contract, dollar risk, execution path, and invalidation are known.</text>
  </g>
</svg>
